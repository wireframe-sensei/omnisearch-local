[package]
name = "omnisearch-local"
version = "0.1.0"
description = "Privacy-first, local-only semantic file search for the desktop — no cloud, no telemetry."
authors = ["Yaswanth Reddy Ubbara"]
license = "MIT"
repository = "https://github.com/wireframe-sensei/omnisearch-local"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omnisearch_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
pdf-extract = "0.12.0"
notify = "8.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
html2text = "0.17.1"
rtf-parser = { version = "0.4.3", default-features = false }
tauri-plugin-global-shortcut = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
calamine = "0.36.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41.0"
rayon = "1.10.0"
tauri-plugin-autostart = "2.5.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
