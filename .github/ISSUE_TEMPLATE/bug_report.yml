name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much of this as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots or a screen recording are especially helpful for UI issues.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Index folder '...'
        2. Search for '...'
        3. See error
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: e.g. macOS 15.1, Windows 11 23H2, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version (or commit hash if built from source)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant terminal output
      description: If you ran this via `pnpm tauri dev`, paste any errors from the terminal here.
      render: shell
    validations:
      required: false
